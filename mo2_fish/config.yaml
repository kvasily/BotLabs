# All rectangles: [x, y, width, height], physical pixels relative to game_origin.
resolution: [3840, 2160]
video_source_resolution: null  # Informational; decoded dimensions of last teacher file.
video_scale_mode: fit          # fit preserves aspect; stretch explicitly changes proportions.
game_origin: [0, 0]
window_title_contains: Mortal Online 2
audio_device_name: TODO
counts_per_degree: TODO   # Signed: positive if positive mouse dx turns clockwise.
water_heading_arc_deg: [270, 360]
quest_catch_count: 3
enable_wasd_recovery: false
rois:
  compass: TODO
  hit_marker: TODO
  interact_prompt: TODO
  quest_list: TODO
  hook_slot: TODO
  bait_slot: TODO
  inventory: TODO
  quest_paper: TODO
  confirm_button: TODO
  quest_tooltip: TODO
  turn_in_button: TODO
  catch_indicator: TODO
  bait_count: TODO
tasks:
  bassle:
    fish_name: Bassle
    fight: hold_rmb_only
    precedence: 0
    always_available: false
    hook_template: templates/hook_bassle.png
    bait_template: templates/bait_bassle.png
    hook_inventory_rect: TODO
    bait_inventory_rect: TODO
    audio_template: null
  redline_torp:
    fish_name: Redline Torp
    fight: reel_lmb_and_pull_rmb_on_tension
    precedence: 1
    always_available: true
    hook_template: templates/hook_redline.png
    bait_template: templates/bait_redline.png
    hook_inventory_rect: TODO
    bait_inventory_rect: TODO
    audio_template: null
templates:
  hit_marker: templates/hit_marker.png
  taskmaster: templates/taskmaster_fishing.png
  bassle: templates/bassle.png
  redline_torp: templates/redline_torp.png
  quest_gui: templates/quest_gui.png   # Stable unique feature inside quest_list ROI.
  confirm: templates/confirm.png
  turn_in: templates/turn_in.png
  catch: templates/catch.png         # Set null only if sfx/catch.wav is configured.
  bait_empty: templates/bait_empty.png # Empty rod bait-slot image, not missing icon.
  bait_zero: templates/bait_zero.png   # A visible zero stack count, cropped tightly.
  progress_0: templates/progress_0.png # Exact 0/3, 1/3, 2/3, 3/3 in tooltip.
  progress_1: templates/progress_1.png
  progress_2: templates/progress_2.png
  progress_3: templates/progress_3.png
vision:
  threshold: 0.88
  progress_margin: 0.04
  stable_frames: 3
  ocr_enabled: false
  tesseract_cmd: null
compass:
  mode: north                      # north | ticks
  north_template: templates/compass_n.png
  center: TODO                     # [cx, cy] relative to compass ROI.
  ring_radius: TODO                 # Pixels; used to reject off-ring N matches.
  ring_tolerance_px: 14
  bearing_sign: -1                  # Standard rotating compass: yaw = -bearing(N).
  zero_offset_deg: 0
  tolerance_deg: 2.0
  max_correction_steps: 7
  # Identical ticks cannot encode absolute yaw. Supply labeled top-patch samples.
  # Example: [{heading: 0, path: templates/tick_000.png}, ... every 5–10 degrees].
  tick_templates: []
  tick_top_rect: TODO               # Relative to compass ROI; used only in ticks mode.
  tick_ambiguity_margin: 0.03
audio:
  sample_rate: 48000
  hop_ms: 30
  ring_seconds: 1.0
  channels: 2                      # WASAPI stereo capture, then downmix to mono.
  stale_seconds: 1.5
  tension_on_ms: 120
  tension_off_ms: 120
  tension_tail_ms: 60               # Max age of a correlation match ending now.
  event_cooldown_s: 1.5
  templates:
    bubble: sfx/bubble.wav
    splash: sfx/splash.wav
    tension: sfx/tension.wav
    quest_complete: sfx/quest_complete.wav
    catch: null                    # Optional: sfx/catch.wav
  thresholds: {bubble: 0.72, splash: 0.78, tension: 0.68, quest_complete: 0.80, catch: 0.80}
  min_rms: 0.003
  splash_over_bubble_margin: 0.05
  spectral_flux:
    enabled: false
    band_hz: [500, 10000]
    threshold: 0.005               # Optional splash gate; never triggers by itself.
timing:
  T_land_ms: 1500
  T_ignore_s: 2.5
  T_fight_max_s: 90
  T_bored_s: 75
  cast_hold_s: [1.0, 2.0]
  pre_cast_s: [0.4, 2.2]
  hook_hold_s: [0.12, 0.22]
  interact_hold_s: [0.7, 1.2]
  gui_timeout_s: 5
  resolve_s: 1.2
  look_interval_s: [8, 25]
  look_angle_deg: [8, 20]
  poll_s: 0.03
ui:
  cursor_toggle_key: TODO           # Your binding; null if cursor already available.
  close_quest_key: esc
  interact_key: e
  settle_s: 0.35
  hover_s: 0.7
progress:
  verify_every_n_catches: 1
  max_unverified_catches: 6
recovery:
  direct_cast_tries: 3
  sweep_cast_tries: 3
  npc_heading_deg: 135
  npc_scan_half_arc_deg: 80
  npc_scan_step_deg: 5
  scan_step_s: [0.16, 0.30]
  # Used only after look-only retries AND NPC scan both fail, when enabled above.
  wasd_key: s
  wasd_hold_s: 0.15
  max_wasd_attempts: 1
logout:
  # Replace with YOUR verified sequence. Each step: {key: esc, wait_s: 0.7}
  # or {click: [x, y], wait_s: 0.7}. Coordinates relative to game_origin.
  sequence: TODO
  success_roi: TODO
  success_template: templates/logged_out.png
  timeout_s: 10
debug:
  window: true
  log_file: logs/mo2_fish.log
